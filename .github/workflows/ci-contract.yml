name: CI Contract

on:
  push:
    paths: ["docs/contracts/**", "scripts/check-drift.sh", ".github/workflows/ci-contract.yml"]
  pull_request:
    paths: ["docs/contracts/**"]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # prepare_runtime 契约测试用真实 lib/ 子模块验证软链幂等（异常信息也提示
          # 需 submodule update），故契约 CI 必须拉子模块
          submodules: recursive
      - name: 检查契约漂移
        run: bash scripts/check-drift.sh
      - name: 安装测试依赖
        # 契约测试经 registry/stub 连带 import pptx（python-pptx），其余全是标准库，
        # 故只装这两个包，不拖 backend/engine 的完整运行时依赖树。
        run: pip install pytest python-pptx==1.0.2
      - name: 运行契约测试
        run: python -m pytest tests/contract/ -q
