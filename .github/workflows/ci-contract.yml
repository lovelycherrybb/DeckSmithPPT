name: CI Contract

# 触发面必须覆盖"漂移的两个来源"：契约文件本身，以及后端路由代码。
# 只盯 docs/contracts 的话，"加一个接口忘了写契约"这个方向永远不会被触发——
# 而那恰恰是漂移检查存在的另一半理由。（同一课见 ci-backend.yml 顶部注释。）
on:
  push:
    paths:
      - "docs/contracts/**"
      - "packages/backend/**"
      - "scripts/check-drift.sh"
      - "scripts/check-drift.py"
      - "scripts/check-alignment.py"
      # 交付包构建口径的检查件（tests/contract/release_mirror_switch_test.py）守的就是
      # 这两个来源：发版脚本与前端镜像定义。不列进来的话，改了它们这一层不会跑——
      # 与顶部注释说的是同一个教训。后端 Dockerfile 已被 packages/backend/** 覆盖。
      - "scripts/release.sh"
      - "packages/frontend/Dockerfile"
      - "tests/**"
      - ".github/workflows/ci-contract.yml"
  pull_request:
    paths:
      - "docs/contracts/**"
      - "packages/backend/**"
      - "packages/frontend/Dockerfile"
      - "scripts/release.sh"
      - "tests/**"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # prepare_runtime 契约测试用真实 lib/ 子模块验证软链幂等（异常信息也提示
          # 需 submodule update），故契约 CI 必须拉子模块；依赖清单链也递归到那里
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          # 与交付镜像一致，理由同 ci-backend.yml
          python-version: "3.11"

      - name: 安装依赖
        # 顺序很重要：装依赖排在漂移检查**之前**。ADR-026 起 check-drift.py 要
        # import app.main 才能拿到真实路由表，fastapi/sqlalchemy/pydantic 缺一个
        # 它就取不到数据 —— 而它取不到数据时是 exit 1，不是"没比上也算过"。
        # 走单一入口 requirements.txt（AGENTS：backend → engine → 上游清单是递归引用），
        # 不再手抄一份包名单，那正是上一版注释与清单互相脱节的成因。
        run: |
          python -m pip install --upgrade pip
          pip install -r packages/backend/requirements.txt
          # httpx 是 starlette TestClient 的运行前提（tests/conftest.py 模块级 import）；
          # jsonschema 供 api_contract_test.py 校验真实响应形状；pyyaml 供解析契约
          pip install pytest httpx jsonschema pyyaml

      - name: 检查契约漂移
        run: bash scripts/check-drift.sh

      - name: 检查 vc_design 与 contracts 对齐
        # 状态层校验口径是「引擎态 ⊆ 任务态」（分层枚举，见 ADR-018），
        # 同时比对对象层/必填字段/pattern/接口清单。改契约若漏同步任一处，这里当场红。
        run: python scripts/check-alignment.py

      - name: 运行契约测试
        run: python -m pytest tests/contract/ -q
