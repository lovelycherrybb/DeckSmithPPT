# DeckSmith 交付编排（ADR-012 决策 4：2 个常驻服务 + 4 数据卷；另含 1 个一次性 data-init）
#
#   cd deploy && cp .env.example .env && 编辑 .env 填凭证 && docker compose up -d --build
#   访问 http://localhost:3000
#   用交付包导入的镜像启动：docker compose up -d --no-build   （IMAGE_TAG 取自 deploy/.env）
#
# 设计约束：
#   * 镜像无状态，全部可写状态落 ./data；删容器不丢数据（决策 5）。
#   * 凭证只经 env_file 注入，绝不写进镜像层（决策 4）。
#   * web 的 API 代理目标是**构建期**烘焙的，故 BACKEND_HOST 走 build arg、
#     且必须等于 service 名 `app`——容器里 127.0.0.1 打不到后端（决策 6 同源问题）。
#   * IMAGE_TAG **必填**、不给兜底默认值：写死默认会把人静默引向旧版本，而标签指向的镜像
#     不存在时 compose 会转头去构建（离线环境随即失败）。值随发版更新，写在 deploy/.env。
#   * 离线导入场景一律带 --no-build：本文件保留 build 段供源码构建用，但只用镜像时
#     不该让 compose 有机会去解析构建上下文。

name: decksmith

services:
  # 一次性初始化：把宿主 bind 卷的属主交给容器的运行身份（uid 1000）。
  # 为什么必须有：bind 卷对应的宿主目录若不存在，是由 dockerd 以 **root** 创建的；
  # 而 app/web 以非 root 的 node(1000:1000) 运行，写不进 /data/home，表现为
  # 启动即 `mkdir /data/home/.claude: Permission denied` 并循环重启。
  # 在 OrbStack 这类会做 uid 映射的运行时上不会复现——属真实 Linux + stock dockerd
  # 的首装阻塞项（已在 Debian 12 干净机器实测到并据此修复）。
  # 复用 app 镜像故不额外交付；每次启动都跑：幂等，且从备份 tar 恢复后属主往往已变。
  data-init:
    image: decksmith/app:${IMAGE_TAG:?set IMAGE_TAG in deploy/.env}
    user: root
    entrypoint:
      - sh
      - -c
      - |
        mkdir -p /data/jobs /data/db /data/home /data/decks
        chown -R 1000:1000 /data
        chmod 755 /data
        echo "[data-init] /data 属主已就绪（uid 1000）"
    volumes:
      - ./data:/data          # 统一挂 /data，一次修齐四个子卷（含 decks）
    restart: "no"

  app:
    build:
      context: ..
      dockerfile: packages/backend/Dockerfile
      args:
        BASE_IMAGE: ${BASE_IMAGE:-node:20-slim}
        CLAUDE_VERSION: ${CLAUDE_VERSION:-2.1.197}
    image: decksmith/app:${IMAGE_TAG:?set IMAGE_TAG in deploy/.env}
    # 必须等属主修好再启动，否则 entrypoint 的 mkdir 会失败
    depends_on:
      data-init:
        condition: service_completed_successfully
    env_file: .env
    environment:
      BACKEND_PORT: "8080"
      DECKSMITH_JOBS_ROOT: /data/jobs
      DECKSMITH_VERSION: ${IMAGE_TAG}   # 发版镜像标签即当前版本，供前端页头/首页显示；dev 不设此 env → 不显示
      DATABASE_URL: sqlite:////data/db/decksmith.db
      HOME: /data/home
    volumes:
      - ./data/jobs:/data/jobs          # 两引擎产物 + job.json + run.log
      - ./data/db:/data/db              # SQLite（项目/任务/草稿历史）
      - ./data/home:/data/home          # HOME：收编 ~/.claude（技能软链+会话 jsonl）与 ~/.ppt-master
      # 归位前的历史产物；新任务不再写这里。留这个挂载有两个作用：
      # 旧演示文件库仍可读，且万一 cwd 回归旧行为，产物会落在这里而不是污染只读代码树
      - ./data/decks:/app/lib/ppt-master/projects
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/docs"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s

  web:
    build:
      context: ..
      dockerfile: packages/frontend/Dockerfile
      args:
        BASE_IMAGE: ${BASE_IMAGE:-node:20-slim}
        BACKEND_HOST: app               # 构建期烘焙，必须等于上面的 service 名
        BACKEND_PORT: "8080"
    image: decksmith/web:${IMAGE_TAG:?set IMAGE_TAG in deploy/.env}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
