<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
  <defs>
    <linearGradient id="dsGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4361ee;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 背景 -->
  <rect width="400" height="120" fill="none"/>
  
  <!-- DS字母组合 -->
  <g transform="translate(20, 20)">
    <!-- 字母D -->
    <path d="M20,0 L60,0 C80,0 95,15 95,35 C95,55 80,70 60,70 L20,70 L20,0 Z" 
          fill="url(#dsGradient)" stroke="none"/>
    
    <!-- D的开口 - 融入锤子轮廓 -->
    <path d="M60,15 C70,15 75,20 75,35 C75,50 70,55 60,55 L20,55 L20,15 L60,15 Z" 
          fill="#ffffff" stroke="none"/>
    
    <!-- 工具元素 - 锤子 -->
    <path d="M85,25 L95,15 L105,25 L95,35 Z" 
          fill="#4361ee" stroke="none"/>
    <path d="M95,35 L95,60" 
          stroke="#4361ee" stroke-width="4" stroke-linecap="round"/>
    
    <!-- 字母S -->
    <path d="M120,0 L160,0 C180,0 195,15 195,35 C195,55 180,70 160,70 L120,70 
             C140,70 155,55 155,35 C155,15 140,0 120,0 Z" 
          fill="url(#dsGradient)" stroke="none"/>
    
    <!-- S的曲线 - 体现文档流动 -->
    <path d="M120,15 L160,15 C170,15 175,20 175,35 C175,50 170,55 160,55 L120,55 
             C130,55 135,50 135,35 C135,20 130,15 120,15 Z" 
          fill="#ffffff" stroke="none"/>
    
    <!-- 文档元素 - 翻页效果 -->
    <path d="M145,40 L155,30 L165,40 L155,50 Z" 
          fill="#4361ee" stroke="none"/>
    <path d="M155,50 L155,75" 
          stroke="#4361ee" stroke-width="4" stroke-linecap="round"/>
  </g>
  
  <!-- 品牌名称 -->
  <text x="240" y="55" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
        font-size="36" font-weight="600" fill="#1a1a2e" letter-spacing="-0.5px">
    DeckSmith
  </text>
  
  <!-- 产品描述 -->
  <text x="240" y="85" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
        font-size="14" fill="#6b7280" letter-spacing="1px">
    PPT GENERATOR
  </text>
  
  <!-- 装饰元素 - 箭头体现转换 -->
  <path d="M220,45 L230,40 L220,35" 
        stroke="#4361ee" stroke-width="2" fill="none" stroke-linecap="round"/>
</svg>
