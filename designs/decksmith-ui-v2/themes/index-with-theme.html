<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeckSmithPPT</title>
    <style>
        :root {
            --primary: #8b5cf6;
            --primary-dark: #7c3aed;
            --bg: #0a0a0a;
            --text-primary: #f3f4f6;
            --text-muted: #6b7280;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .glow {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
        }

        .content {
            text-align: center;
            position: relative;
            z-index: 10;
        }

        .logo {
            font-size: 180px;
            font-weight: 900;
            line-height: 1;
            letter-spacing: -8px;
            margin-bottom: 20px;
            transition: transform 0.15s ease-out;
        }

        .logo .d { color: var(--primary); }
        .logo .s { color: var(--text-primary); }

        .tagline {
            font-size: 20px;
            color: var(--text-muted);
            letter-spacing: 4px;
            margin-bottom: 12px;
        }

        .brand {
            font-size: 14px;
            color: var(--text-muted);
            letter-spacing: 8px;
            margin-bottom: 40px;
        }

        .btn-start {
            padding: 16px 48px;
            background: var(--primary);
            color: white;
            border: none;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 200ms ease;
            text-decoration: none;
            display: inline-block;
        }

        .btn-start:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(139, 92, 246, 0.3);
        }

        /* 主题切换按钮 */
        .theme-toggle {
            position: fixed;
            top: 24px;
            right: 24px;
            width: 44px;
            height: 44px;
            border-radius: 12px;
            border: 1px solid #1f1f1f;
            background: #111111;
            color: #9ca3af;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 200ms ease;
            z-index: 100;
        }

        .theme-toggle:hover {
            background: #1a1a1a;
            border-color: #2f2f2f;
            color: #f3f4f6;
            transform: scale(1.05);
        }

        .theme-toggle svg {
            transition: transform 300ms ease;
        }

        .theme-toggle:hover svg {
            transform: rotate(30deg);
        }
    </style>
</head>
<body>
    <!-- 主题切换按钮 -->
    <button class="theme-toggle" onclick="toggleTheme()" title="切换到浅色主题">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5"/>
            <line x1="12" y1="1" x2="12" y2="3"/>
            <line x1="12" y1="21" x2="12" y2="23"/>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
            <line x1="1" y1="12" x2="3" y2="12"/>
            <line x1="21" y1="12" x2="23" y2="12"/>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
    </button>

    <div class="glow" id="glow"></div>

    <div class="content">
        <div class="logo" id="logo">
            <span class="d">D</span><span class="s">S</span>
        </div>
        <div class="tagline">材料 × AI = 演示文件</div>
        <div class="brand">DECKSMITHPOWER</div>
        <a href="studio-faithful.html" class="btn-start">开始使用</a>
    </div>

    <script>
        // 鼠标跟踪效果
        const page = document.body;
        const glow = document.getElementById('glow');
        const logo = document.getElementById('logo');

        page.addEventListener('mousemove', (e) => {
            const x = e.clientX;
            const y = e.clientY;
            const w = window.innerWidth;
            const h = window.innerHeight;
            
            glow.style.background = `radial-gradient(600px circle at ${x}px ${y}px, rgba(139,92,246,0.15), transparent 40%)`;
            
            const rotateY = ((x / w) - 0.5) * 8;
            const rotateX = ((y / h) - 0.5) * -5;
            logo.style.transform = `perspective(500px) rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
        });

        // 主题切换
        function toggleTheme() {
            // 由于首页是特殊的全屏设计，切换主题时跳转到带浅色主题指示的版本
            // 这里我们简单地将主题偏好保存到localStorage
            const currentTheme = localStorage.getItem('decksmith-theme') || 'dark';
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            localStorage.setItem('decksmith-theme', newTheme);
            
            // 更新按钮图标
            updateThemeButton(newTheme);
            
            // 显示提示
            alert('主题已切换为' + (newTheme === 'dark' ? '深色' : '浅色') + '模式，进入工作台后生效');
        }

        function updateThemeButton(theme) {
            const btn = document.querySelector('.theme-toggle');
            if (theme === 'dark') {
                btn.innerHTML = `
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="5"/>
                        <line x1="12" y1="1" x2="12" y2="3"/>
                        <line x1="12" y1="21" x2="12" y2="23"/>
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
                        <line x1="1" y1="12" x2="3" y2="12"/>
                        <line x1="21" y1="12" x2="23" y2="12"/>
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
                        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
                    </svg>
                `;
                btn.title = '切换到浅色主题';
            } else {
                btn.innerHTML = `
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                    </svg>
                `;
                btn.title = '切换到深色主题';
            }
        }

        // 初始化：检查保存的主题偏好
        const savedTheme = localStorage.getItem('decksmith-theme') || 'dark';
        updateThemeButton(savedTheme);
    </script>
</body>
</html>
