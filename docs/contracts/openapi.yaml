openapi: 3.1.0
info:
  title: DeckSmithPPT API
  version: 0.9.0
  description: '前后端契约（唯一来源）。后端实现本契约，前端从本文件生成类型。

    与 engine.schema.json 保持一致：通用层（DeckRequest/Job）。引擎参数层已移至 engine.schema.json 定义。

    生成流程：草稿引擎任务和输出引擎任务各自独立提交，提交即入队（queued），由调度侧认领后转 running。
    草稿引擎任务：queued → running → completed（生成草稿）。输出引擎任务：queued → running → completed/failed/timeout。
    未进入终态的任务可撤销（queued/running → cancelled），详见 components.schemas.JobStatus 的状态机说明。

    与 vc_design 保持一致：接口定义来自 docs/vc_design/interfaces/01-系统接口-SystemAPI.md。

    任务类型：明确区分草稿引擎任务和输出引擎任务。

    项目管理：支持自动创建项目（首次上传时）。

    '
paths:
  # ===== 版本 =====
  /api/version:
    get:
      summary: 获取当前安装包版本
      description: '返回发版时注入的部署版本（compose 用 IMAGE_TAG 写入 DECKSMITH_VERSION）。

        开发态未注入该环境变量时 version 为 null，前端据此不显示版本——版本是已发布产物的属性。

        '
      operationId: getAppVersion
      responses:
        '200':
          description: 当前版本
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionOut'

  # ===== 身份与鉴权 =====
  /api/auth/login:
    post:
      summary: 登录
      description: '校验用户名+密码，成功建会话并 Set-Cookie（httpOnly）。
        内联把当前访客 cookie 下的未认领项目并入该用户。禁用账号 → 403。
        '
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResult'
        '401':
          description: 用户名或密码错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 账号被禁用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/auth/logout:
    post:
      summary: 登出
      description: 服务端销毁会话、清除 Cookie
      operationId: logout
      security:
      - sessionCookie: []
      responses:
        '204':
          description: 已登出

  /api/auth/me:
    get:
      summary: 当前身份（含未登录访客）
      description: '恒 200，供前端渲染头像、决定菜单可见与角色门控。三态：已登录 / 未登录有访客身份 / 纯匿名。
        '
      operationId: getCurrentUser
      security: []
      responses:
        '200':
          description: 当前身份
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'

  /api/auth/password:
    post:
      summary: 修改自己的密码
      description: 仅改本人；成功后当前会话不失效
      operationId: changePassword
      security:
      - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: 修改成功
        '401':
          description: 未登录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ===== 用户管理（仅管理员）=====
  /api/users:
    get:
      summary: 用户列表
      description: 仅管理员；不含密码。
      operationId: listUsers
      security:
      - sessionCookie: []
      responses:
        '200':
          description: 用户列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        '401':
          description: 未登录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 非管理员
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: 新增用户
      description: 仅管理员。初始密码固定 234567。
      operationId: createUser
      security:
      - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
      responses:
        '201':
          description: 新用户
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '403':
          description: 非管理员
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 用户名已存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/users/{user_id}:
    patch:
      summary: 修改用户信息
      description: 仅管理员；用户名不可改（不在请求体）。
      operationId: updateUser
      security:
      - sessionCookie: []
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
      responses:
        '200':
          description: 更新后的用户
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '403':
          description: 非管理员
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 用户不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/users/{user_id}/reset-password:
    post:
      summary: 重置用户密码为 234567
      description: 仅管理员；不返回明文。
      operationId: resetUserPassword
      security:
      - sessionCookie: []
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: 已重置
        '403':
          description: 非管理员
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 用户不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/users/{user_id}/status:
    patch:
      summary: 启用/禁用用户
      description: 仅管理员；禁用只挡登录、保留数据。管理员自身不可被禁用（→403）。
      operationId: setUserStatus
      security:
      - sessionCookie: []
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserStatusUpdate'
      responses:
        '200':
          description: 更新后的用户
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '403':
          description: 非管理员，或试图禁用管理员
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 用户不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ===== 用户偏好（本人）=====
  /api/settings/preferences:
    get:
      summary: 获取本人偏好
      description: 需登录；无记录时返回系统默认。
      operationId: getMyPreferences
      security:
      - sessionCookie: []
      responses:
        '200':
          description: 本人偏好
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPreference'
        '401':
          description: 未登录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      summary: 保存本人偏好
      description: 需登录；每人一份、跨设备带回。
      operationId: saveMyPreferences
      security:
      - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserPreferenceUpdate'
      responses:
        '200':
          description: 更新后的偏好
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPreference'
        '401':
          description: 未登录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ===== 引擎相关 =====
  /api/engines:
    get:
      summary: 获取引擎列表及参数说明书
      description: '前端用此接口动态渲染"引擎选择"和"引擎参数表单"。

        每项包含引擎名称、描述、以及该引擎的 engine_params 参数说明书（JSON Schema）。

        用户选择引擎后，前端根据 params_schema 自动渲染对应表单控件。

        支持按引擎类型筛选（草稿引擎/输出引擎）。

        '
      operationId: listEngines
      parameters:
      - name: type
        in: query
        required: false
        schema:
          type: string
          enum:
          - draft
          - output
          description: 按引擎类型筛选（草稿引擎/输出引擎）
      responses:
        '200':
          description: 引擎列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EngineInfo'

  # ===== 文件上传 =====
  /api/upload:
    post:
      summary: 上传源文件（docx/pdf 等）
      description: '上传用户本地文件，后端存到 jobs_root/uploads/<upload_id>/，返回服务器路径。

        该路径作为 DeckRequest.sources[].value（type=file_path）提交，引擎再用 source_to_md 转成草稿。

        '
      operationId: uploadFile
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: 待上传的源文件
      responses:
        '200':
          description: 上传成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadResponse'

  /api/agent/execute:
    post:
      summary: Agent 文本处理（统一接口）
      description: '丢一段任务给 AI、拿文本回来——所有 Agent 文本能力的统一入口。

        kind 是后端注册的白名单（非任意提示词透传）。新增 AI 能力 = 注册新 kind + 提示词模板。

        预置 kind：
        - modify_draft：修改草稿（draft_id + version + prompt → 改写后的 Markdown）
        - suggest_title：拟标题（files → 标题；单文件直接文件名，多文件 Agent 概括）

        安全约束：输入内容先过安全检查（POST /api/drafts/check 同套规则），通过才调 Agent。

        '
      operationId: executeAgent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentExecuteRequest'
      responses:
        '200':
          description: Agent 返回的文本
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentExecuteResult'
        '400':
          description: kind 未注册、参数不合法或安全检查不通过
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 引用的资源不存在（如草稿/版本）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: Agent 调用失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'


  /api/agent/execute-async:
    post:
      summary: Agent 文本处理（异步接口）
      description: '丢一段任务给 AI、立即返回会话ID，后台异步执行。适用于长时间运行的任务，避免前端超时。

        输入参数与同步接口相同，安全约束一致。

        会话ID可用于：
        - 查询会话状态：GET /api/agent/sessions/{session_id}
        - 获取流式输出：GET /api/agent/sessions/{session_id}/stream

        '
      operationId: executeAgentAsync
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentExecuteRequest'
      responses:
        '200':
          description: 会话ID（立即返回）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentSessionResponse'
        '400':
          description: kind 未注册、参数不合法或安全检查不通过
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 引用的资源不存在（如草稿/版本）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: Agent 调用失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/agent/sessions/{session_id}:
      summary: 查询 Agent 会话状态（代理接口）
      description: '代理查询异步 Agent 任务的会话状态和最新输出片段。

        本接口直接代理到对应 Agent 的原生查询接口，不进行额外封装。

        会话状态：running（运行中）、completed（已完成）、failed（失败）。

        '
      operationId: getAgentSession
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          description: 会话ID（来自 execute-async 接口）
      responses:
        '200':
          description: 会话状态信息
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentSessionStatus'
        '404':
          description: 会话不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/agent/sessions/{session_id}/stream:
      summary: 获取 Agent 会话流式输出（代理接口）
      description: '代理实时获取 Agent 的输出，支持流式显示。

        本接口直接代理到对应 Agent 的原生流式输出接口，不进行额外封装。

        返回 SSE（Server-Sent Events）流，每行一个 JSON 对象。

        事件类型：
        - text：文本输出片段
        - status：状态更新（如"正在分析内容..."）
        - error：错误信息
        - done：完成信号

        '
      operationId: getAgentSessionStream
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          description: 会话ID（来自 execute-async 接口）
      responses:
        '200':
          description: SSE 流式输出
          content:
            text/event-stream:
              schema:
                type: string
                description: |
                  SSE 格式，每行一个 JSON 对象：
                  - text 事件：{"type": "text", "data": "输出片段"}
                  - status 事件：{"type": "status", "data": "状态描述"}
                  - error 事件：{"type": "error", "data": "错误信息"}
                  - done 事件：{"type": "done", "data": "完成"}
        '404':
          description: 会话不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/engines/suggest-title:
    post:
      deprecated: true
      summary: '（已废弃）拟演示文件标题'
      description: '已废弃：改用 POST /api/agent/execute（kind=suggest_title）。
        过渡期保留兼容，后续版本删除。
        '
      operationId: suggestTitle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SuggestTitleRequest'
      responses:
        '200':
          description: 拟题结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuggestTitleResult'
        '400':
          description: 输入不合法或安全检查不通过
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: Agent 调用失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ===== 项目相关 =====
  /api/projects:
    get:
      summary: 获取项目列表
      description: '返回所有项目，支持分页。项目是顶层聚合根，管理所有相关任务。

        项目自动创建：用户首次上传文件时，如未指定 project_id，系统自动创建新项目。

        '
      operationId: listProjects
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 20
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          default: 0
      responses:
        '200':
          description: 项目列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Project'

  /api/projects/{project_id}:
    get:
      summary: 获取项目详情
      description: '返回项目信息，包含关联的任务、草稿、演示文件列表。

        支持草稿独立实体：每个草稿有唯一标识和版本管理。

        '
      operationId: getProject
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: 项目详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectDetail'
        '404':
          description: 项目不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: 删除项目（仅管理员，本期限未认领访客项目）
      description: '系统此前无删除能力，本条为新增。本期仅放开管理员删除未认领的访客项目；
        对已归属真实用户的项目返回 409（是否扩展到删任意项目待定）。
        '
      operationId: deleteProject
      security:
      - sessionCookie: []
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: 已删除
        '403':
          description: 非管理员
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 项目不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 该项目已归属真实用户，本期不允许删除
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ===== 管理员代为认领未认领访客项目 =====
  /api/projects/{project_id}/claim:
    post:
      summary: 代为认领（仅管理员）
      description: '把一个未认领的访客项目重新归属到指定真实用户（应对试用者换设备登录、无法自助认领）。
        '
      operationId: claimProject
      security:
      - sessionCookie: []
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClaimProjectRequest'
      responses:
        '200':
          description: 归属已变更的项目
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '403':
          description: 非管理员
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 项目或目标用户不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ===== 任务相关 =====
  /api/decks:
    post:
      summary: 提交生成任务
      description: '用户上传文件后调用，创建草稿引擎任务或输出引擎任务。

        任务类型区分：
        - 草稿引擎任务：调用草稿生成引擎，将用户文件转化为 Markdown 草稿
        - 输出引擎任务：调用输出引擎，将草稿内容生成最终展示文件

        项目自动创建：
        - 如未指定 project_id，系统自动创建新项目
        - 项目名称默认为上传文件名（去除扩展名）

        任务状态流转：
        - 草稿引擎任务：queued → running → completed（生成草稿）
        - 输出引擎任务：queued → running → completed/failed/timeout
        - 本接口返回的任务处于 queued（已受理、引擎进程尚未拉起），
          调度侧认领并把引擎子进程 fork 成功后才转 running；见 components.schemas.JobStatus

        '
      operationId: submitDeck
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeckRequest'
      responses:
        '202':
          description: 已受理，返回任务
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '400':
          description: 请求不合法（参数校验失败）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/jobs:
    get:
      summary: 获取任务历史列表
      description: '支持按状态过滤和简单分页，供历史页使用。

        支持按项目ID筛选，获取特定项目的任务列表。

        任务类型：草稿引擎任务和输出引擎任务。

        '
      operationId: listJobs
      parameters:
      - name: project_id
        in: query
        required: false
        schema:
          type: string
          description: 按项目ID筛选
      - name: status
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/JobStatus'
      - name: task_type
        in: query
        required: false
        schema:
          type: string
          enum:
          - draft
          - output
          description: 按任务类型筛选（草稿引擎任务/输出引擎任务）
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 20
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          default: 0
      responses:
        '200':
          description: 任务列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Job'

  /api/jobs/{job_id}:
    get:
      summary: 获取任务详情
      description: '返回任务信息，包含当前状态和状态明细。

        状态明细（status_detail）仅在非终态（queued / running）下有意义，内容随执行进度变化。

        前端通过轮询获取最新状态。

        '
      operationId: getJob
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: 任务详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '404':
          description: 任务不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/jobs/{job_id}/retry:
    post:
      summary: 重试未成功结束的任务（创建新任务）
      description: '任务未成功结束后，创建一个新任务重新执行。

        可重试的状态 = 未成功的终态：failed / timeout / cancelled。
        completed（已成功）与 queued / running（未结束）一律拒绝。

        原任务状态不变（保持终态），新任务有独立的 job_id，并从 queued 开始排队。

        '
      operationId: retryJob
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '202':
          description: 重试已受理
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '404':
          description: 任务不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 任务状态不允许重试（仅 failed/timeout/cancelled 可重试）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/jobs/{job_id}/cancel:
    post:
      summary: 撤销任务（排队中或运行中）
      description: '撤销一个尚未进入终态的任务，状态 → cancelled。

        两种非终态的撤销语义不同：

        - queued：调度侧尚未认领、引擎子进程还没拉起，直接从队列摘掉；

        - running：请求引擎终止其子进程。**是否支持取决于引擎能力位**——
          EngineInfo.capabilities 含 cancel 的引擎才会真正中断，
          不含的引擎对 running 任务返回 409，**绝不静默返回"已撤销"而让子进程继续跑**。

        终态不可逆：已 completed / failed / timeout / cancelled 的任务返回 409。

        撤销只改变任务状态，不删除磁盘上已写出的中间产物或成品（文件保护口径，
        重跑与审计可能还要用）；已撤销任务已消耗的 token 仍如实保留（ADR-016 口径）。

        '
      operationId: cancelJob
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '202':
          description: 撤销已受理，返回置为 cancelled 的任务
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '404':
          description: 任务不存在（或不属于当前身份）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 任务已是终态，或该引擎不支持中断运行中的任务
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/presentations/{presentation_id}/download:
    get:
      summary: 下载演示文件
      description: 按演示文件标识下载文件。
      operationId: downloadPresentation
      parameters:
      - name: presentation_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: 文件流
          content:
            application/vnd.openxmlformats-officedocument.presentationml.presentation:
              schema:
                type: string
                format: binary
            text/html:
              schema:
                type: string
                format: binary
        '404':
          description: 演示文件不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/jobs/{job_id}/download:
    get:
      summary: 下载生成的 PPTX
      description: 任务 completed 后，返回 result_path 对应的 PPTX 文件流。
      operationId: downloadJob
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: PPTX 文件流
          content:
            application/vnd.openxmlformats-officedocument.presentationml.presentation:
              schema:
                type: string
                format: binary
        '404':
          description: 任务不存在或未生成产物
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/jobs/{job_id}/pages:
    get:
      summary: 获取任务逐页预览
      description: '返回某输出引擎任务的逐页预览快照（易失读模型，不落库）。只列已完成页，不含预测总数、不含 pending 占位。引擎未实现逐页枚举能力时 supports_page_preview=false、pages=[]。演示文件可按其 task_id 复用本端点。'
      operationId: getJobPages
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: 任务逐页预览视图
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobPages'
        '404':
          description: 任务不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/jobs/{job_id}/preview/{path}:
    get:
      summary: 获取任务某页/资源文件
      description: '以引擎为该任务声明的产物根目录为挂载根，返回 svg_output/xxx.svg 或页内引用的 ../images 等资源文件流，使页内相对引用能同源解析。请求路径解析后必须落在该根目录内否则 400（防路径穿越）；仅放行受支持扩展名，否则 415。'
      operationId: getJobPreviewFile
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
      - name: path
        in: path
        required: true
        description: 相对产物根目录的路径（可含子目录，如 svg_output/01_cover.svg）
        schema:
          type: string
      responses:
        '200':
          description: 文件流
          content:
            image/svg+xml:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          description: 非法路径（越界，防路径穿越）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 任务或文件不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: 不支持的文件类型
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ===== 草稿相关 =====
  /api/projects/{project_id}/drafts:
    get:
      summary: 获取项目下的草稿列表
      description: '返回指定项目下的所有草稿。

        草稿是独立实体，有唯一标识和版本管理。

        每个草稿对应一个草稿引擎任务。

        '
      operationId: listProjectDrafts
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: 草稿列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Draft'
        '404':
          description: 项目不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/drafts/{draft_id}:
    get:
      summary: 获取草稿详情
      description: '返回草稿信息，包含版本历史列表。

        草稿版本管理：
        - 版本号格式：年月日时分秒（如 20260907143025）
        - 同一草稿同一秒内只能保存一次（防止版本冲突）
        - 历史版本不可变，可随时还原

        '
      operationId: getDraft
      parameters:
      - name: draft_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: 草稿详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DraftDetail'
        '404':
          description: 草稿不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/drafts/{draft_id}/versions/{version}:
    get:
      summary: 获取草稿指定版本
      description: 返回指定版本的 Markdown 内容。
      operationId: getDraftVersion
      parameters:
      - name: draft_id
        in: path
        required: true
        schema:
          type: string
      - name: version
        in: path
        required: true
        schema:
          type: string
          description: 版本号（年月日时分秒格式）
          pattern: '^[0-9]{14}$'
      responses:
        '200':
          description: 草稿版本内容
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DraftVersion'
        '404':
          description: 草稿或版本不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/drafts/{draft_id}/modify:
    post:
      deprecated: true
      summary: '（已废弃）让 Agent 修改草稿'
      description: '已废弃：改用 POST /api/agent/execute（kind=modify_draft）。
        过渡期保留兼容，后续版本删除。

        用户确认后再调用保存接口。不直接保存，避免覆盖错误内容。
        '
      operationId: modifyDraft
      parameters:
      - name: draft_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModifyDraftRequest'
      responses:
        '200':
          description: 修改后的内容（供前端渲染）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DraftVersion'
        '404':
          description: 草稿不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/drafts/{draft_id}/restore:
    post:
      summary: 还原草稿到历史版本
      description: '将草稿的当前版本切换为指定的历史版本。

        不会删除任何版本，只是更新 current_version 指向。

        '
      operationId: restoreDraftVersion
      parameters:
      - name: draft_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - version
              properties:
                version:
                  type: string
                  description: 要还原到的版本号
                  pattern: '^[0-9]{14}$'
      responses:
        '200':
          description: 还原成功，返回草稿详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Draft'
        '404':
          description: 草稿或版本不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/drafts/{draft_id}/versions:
    post:
      summary: 保存草稿新版本
      description: '用户编辑草稿后调用，保存为新版本。

        版本号自动生成（年月日时分秒格式），同一秒内不允许重复保存。

        '
      operationId: saveDraftVersion
      parameters:
      - name: draft_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveDraftVersionRequest'
      responses:
        '201':
          description: 新版本已保存
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DraftVersion'
        '404':
          description: 草稿不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 版本冲突（同一秒内已保存过）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ===== 演示文件相关 =====
  /api/projects/{project_id}/presentations:
    get:
      summary: 获取项目下的演示文件列表
      description: '返回指定项目下的所有演示文件。

        演示文件由输出引擎任务生成。

        '
      operationId: listProjectPresentations
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: 演示文件列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Presentation'
        '404':
          description: 项目不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ===== 安全检查 =====
  /api/drafts/check:
    post:
      summary: 草稿安全检查
      description: '在提交给 Agent 之前进行安全检查。

        检查内容是否包含恶意指令、提示词注入等。

        检查通过才允许调用 Agent。

        '
      operationId: checkDraftSecurity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SecurityCheckRequest'
      responses:
        '200':
          description: 检查结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecurityCheckResult'

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: ds_session
      description: '服务端会话 Cookie（httpOnly）。角色门控（管理员）由后端强制，OpenAPI 不编码角色，仅在端点 description 标注「仅管理员」。'
  schemas:
    # ===== 版本 =====
    VersionOut:
      type: object
      description: 当前安装包版本（开发态未注入则为 null）
      properties:
        version:
          type: string
          nullable: true
          description: 发版注入的版本号，如 0.2.4；开发态为 null

    # ===== 引擎相关 =====
    EngineInfo:
      type: object
      description: 引擎信息
      required:
      - name
      - display_name
      - engine_type
      properties:
        name:
          type: string
          description: 引擎名称（唯一标识）
        display_name:
          type: string
          description: 引擎显示名称
        description:
          type: string
          description: 引擎描述
        engine_type:
          type: string
          enum:
          - draft
          - output
          description: '引擎类型：draft=草稿生成引擎，output=输出引擎'
        params_schema:
          type: object
          description: 引擎参数说明书（JSON Schema），前端据此渲染表单。可选，不提供则使用默认参数。
          additionalProperties: true
        capabilities:
          type: array
          description: '引擎能力位声明，前端据此决定可用交互，与具体引擎名解耦。已知值：page_preview=支持逐页产物预览（由引擎实现逐页枚举钩子自动派生）；页可以是独立文件（如逐页 SVG），也可以是同一份单文件 HTML 里的第 N 个页面（由预览路由注入引导脚本按 ?slide=N 定位），能力位本身不对应「每页一个文件」。cancel=支持中断**运行中**的任务（由引擎实现取消钩子自动派生）；不具备该能力位的引擎，对 running 任务调用撤销接口会返回 409，只有 queued 任务能被撤销——前端据此决定撤销按钮的语义，不得假设撤销一定能杀掉进程。默认空数组。'
          items:
            type: string
          default: []

    # ===== 通用层 =====
    DeckRequest:
      type: object
      description: '提交生成请求（通用层，与 engine.schema.json 的 DeckContent 一致）。

        任务类型区分：
        - 草稿引擎任务：调用草稿生成引擎，将用户文件转化为 Markdown 草稿
        - 输出引擎任务：调用输出引擎，将草稿内容生成最终展示文件

        项目自动创建：
        - 如未指定 project_id，系统自动创建新项目
        - 项目名称默认为上传文件名（去除扩展名）

        '
      required:
      - engine
      - engine_type
      properties:
        project_id:
          type: string
          description: '项目标识（可选，不提供则自动创建新项目）。自动创建时，项目名称默认为上传文件名（去除扩展名）。'
        engine:
          type: string
          enum:
          - ppt_master
          - ppt_master_v6
          - claude_draft
          - ppt_master_draft
          - guizang_ppt
          description: 选择哪个引擎（注册表里的名字，与 GET /api/engines 返回的 name 一致）
        engine_type:
          type: string
          enum:
          - draft
          - output
          description: '引擎类型：draft=草稿引擎任务，output=输出引擎任务'
        title:
          type: string
          description: PPT 标题（可选，可从源材料提取或由 AI 自动生成）
        content:
          type: string
          description: Markdown 内容。输出引擎任务可直接提供，或通过 draft_id + version 引用草稿实体。最多15000字符。
          maxLength: 15000
        draft_id:
          type: string
          description: '草稿标识（输出引擎任务可选）。提供后系统自动从草稿版本中获取 content，无需手动传 content。'
        version:
          type: string
          description: '草稿版本号（与 draft_id 配合使用）。不提供则使用草稿的当前版本。'
          pattern: '^[0-9]{14}$'
        content_style:
          type: string
          default: marketing_promo
          description: 内容风格（先由 agent 对话式重写 Markdown，再交给引擎）
        pages:
          type: integer
          minimum: 1
          description: 目标页数（可选，可由 AI 决定或使用默认值）
        agent:
          type: string
          enum:
          - claude
          - codex
          - hermes
          default: claude
          description: 驱动引擎的 AI agent（通用层，可选）。claude=Claude Code；codex=Codex CLI；hermes=Hermes
        sources:
          type: array
          description: '原始素材来源列表（提交时提供，用于生成草稿）。优先于 content。支持多文件上传。'
          items:
            type: object
            required:
            - type
            - value
            properties:
              type:
                type: string
                enum:
                - url
                - file_path
                - text
                description: url=网页链接；file_path=上传返回的 path；text=直接文本
              value:
                type: string
                description: URL / 上传返回的 path / 文本内容
        engine_params:
          type: object
          description: 提交阶段选择的引擎参数（与 /api/engines 返回的 params_schema 对齐）。
          additionalProperties: true

    JobStatus:
      type: string
      description: '任务状态（面向用户与前端），与引擎协议的 EngineJobStatus **分层**：
        queued / cancelled 属编排层，引擎自身永远不会产出这两个状态。

        非终态：queued（已入库、等待调度认领，引擎子进程尚未拉起）、running（引擎子进程已在执行）。

        终态（不可逆）：completed（成功产出）、failed（执行出错）、timeout（超过最大执行时间）、
        cancelled（被撤销）。

        状态机：
          提交 → queued → running → completed / failed / timeout
          queued / running → cancelled（撤销）
          未成功的终态（failed / timeout / cancelled）可重试，重试即新建、从 queued 起。

        消费侧口径（重要）：判"任务是否还在推进"用 status ∈ {queued, running}，
        **不要用 status != ''running''** ——后者会把排队态误判为终态
        （历史上全仓库按"非 running 即终态"写死，引入 queued 后这些判断必须改成"是否终态"）。

        '
      enum:
      - queued
      - running
      - completed
      - failed
      - timeout
      - cancelled

    TokenUsage:
      type: object
      description: '一次引擎任务的 LLM token 消耗（分项 + 派生总数）。口径见 ADR-016：

        - 只统计该任务的引擎主会话；同一任务因 --resume 断点续跑产生的多个 result 事件按分项累加，不覆盖。

        - 后端辅助 agent（拟题、草稿改写/编辑）的消耗不计入本字段，也不混入任务数字。

        - 数据源为 claude CLI stream-json 的 result 事件 usage，该值是整段会话的累计量而非末轮快照。

        - 分项逐项可空：第三方 Anthropic 兼容网关可能不回报 cache_* 字段，未回报项为 null，
        total_tokens 只对已回报项求和。

        - 四项全部缺失时整个 token_usage 为 null，语义是「未记录」（含本能力上线前的存量任务、
        以及不上报用量的引擎）；界面须如实显示「未记录」，禁止用 0 或估算值冒充实测。

        '
      required:
      - total_tokens
      properties:
        input_tokens:
          type: integer
          nullable: true
          description: 非缓存的新增输入 token；引擎/网关未回报时为 null
        cache_creation_input_tokens:
          type: integer
          nullable: true
          description: 写入 prompt cache 的输入 token；引擎/网关未回报时为 null
        cache_read_input_tokens:
          type: integer
          nullable: true
          description: 命中 prompt cache 读到的输入 token（多轮会话里量级远大于新增输入，故必须与
            input_tokens 分列、不可合并展示）；未回报时为 null
        output_tokens:
          type: integer
          nullable: true
          description: 输出 token；引擎/网关未回报时为 null
        total_tokens:
          type: integer
          description: '派生总数 = input_tokens + cache_creation_input_tokens + cache_read_input_tokens
            + output_tokens（缺报项按 0 参与求和）。与 claude CLI 自身对输入总量的算法一致。
            四项全缺时不产出本对象（整体为 null），避免出现假的 0。'

    Job:
      type: object
      description: '引擎任务

        任务类型：
        - 草稿引擎任务：调用草稿生成引擎，将用户文件转化为 Markdown 草稿
        - 输出引擎任务：调用输出引擎，将草稿内容生成最终展示文件

        状态（status）：queued / running / completed / failed / timeout / cancelled，
        状态机与非终态判定口径见 components.schemas.JobStatus。

        状态明细（status_detail）：
        - 仅在非终态（queued / running）下有意义
        - 内容随执行进度变化（如"正在生成第3页..."）
        - 前端通过轮询获取最新状态

        '
      required:
      - job_id
      - status
      - task_type
      properties:
        job_id:
          type: string
          description: 任务唯一 ID
        project_id:
          type: string
          description: 所属项目标识
        task_type:
          type: string
          enum:
          - draft
          - output
          description: '任务类型：draft=草稿引擎任务，output=输出引擎任务'
        status:
          $ref: '#/components/schemas/JobStatus'
        status_detail:
          type: string
          description: '状态明细（引擎当前正在做什么，仅非终态 queued/running 时有意义）。前端通过轮询获取最新状态。'
        queue_position:
          type: [integer, "null"]
          description: '排队位序：本任务前面还有多少个尚未被认领的 queued 任务。
            仅 status=queued 时给出，其余状态为 null。
            读取时按 created_at 现算的派生值——仅供参考、不构成承诺、
            两次轮询之间可能因他人撤销或认领而变化；不入库、不参与任何状态判定。'
        engine_job_id:
          type: string
          description: '引擎任务编号（用于查询 Agent 执行状态，即 Agent 的会话标识）。非 Agent 类引擎可为空。'
        title:
          type: string
          description: PPT 标题（可选，可从源材料提取或由 AI 自动生成）
        pages:
          type: integer
          description: 目标页数
        engine:
          type: string
          description: 选择的引擎
        agent:
          type: string
          description: 驱动引擎的 AI agent
        content_style:
          type: string
          description: 内容风格（用于草稿重写和内容表达）
        engine_params:
          type: object
          description: 提交/确认阶段使用的引擎参数
          additionalProperties: true
        result_path:
          type: string
          description: 生成的 PPTX 文件路径（completed 后非空）
        draft_id:
          type: string
          description: 输出任务所使用的草稿标识（直接给 content 生成时为空）
        draft_version:
          type: string
          pattern: '^[0-9]{14}$'
          description: 输出任务所使用的草稿版本号（年月日时分秒），演示文件命名依据
        draft_content:
          type: string
          description: 草稿 Markdown 内容（已废弃，使用 Draft 实体）
        error:
          type: string
          description: 失败/超时/撤销原因（仅终态 failed/timeout/cancelled 时有值）
        token_usage:
          allOf:
          - $ref: '#/components/schemas/TokenUsage'
          description: '该任务的 LLM token 消耗（引擎主会话累计，草稿引擎任务与输出引擎任务同口径）。
            缺失或为 null = 未记录，含本能力上线前的存量任务与不上报用量的引擎；界面显示「未记录」。'
        created_at:
          type: string
          format: date-time
          description: 创建时间（ISO 8601）
        updated_at:
          type: string
          format: date-time
          description: 最后更新时间（ISO 8601）

    # ===== 项目相关 =====
    Project:
      type: object
      description: '项目（顶层聚合根，管理所有相关任务、草稿、演示文件）。'
      required:
      - project_id
      - project_name
      - created_at
      - updated_at
      properties:
        project_id:
          type: string
          description: 项目标识（唯一）
        project_name:
          type: string
          description: 项目名称（用户可见）
        current_draft_id:
          type: string
          description: 当前草稿标识（用户正在编辑的草稿）
        current_draft_version:
          type: string
          description: 当前草稿版本（用户正在编辑的版本）
          pattern: '^[0-9]{14}$'
        created_at:
          type: string
          format: date-time
          description: 创建时间（ISO 8601）
        updated_at:
          type: string
          format: date-time
          description: 最后更新时间（ISO 8601）
        owner_user_id:
          type: string
          nullable: true
          description: 归属用户标识；null = 尚未被认领的访客项目（登录/代为认领后写入真实用户）
        owner_label:
          type: string
          description: '归属展示名（服务端算好，供管理员视图的「归属用户」列直接渲染）：
            真实用户为其昵称/用户名，未认领访客项目为「未认领（访客）」。普通/高级用户视图不依赖此列。'
        draft_count:
          type: integer
          description: 项目下的草稿数量（列表接口附带统计）
        presentation_count:
          type: integer
          description: 项目下的演示文件数量（列表接口附带统计）
        running_task_count:
          type: integer
          description: 项目下正在运行中的任务数量（列表接口附带统计）

    ProjectDetail:
      type: object
      description: 项目详情（包含关联的任务、草稿、演示文件列表）
      allOf:
      - $ref: '#/components/schemas/Project'
      - type: object
        properties:
          tasks:
            type: array
            description: 关联的任务列表
            items:
              $ref: '#/components/schemas/Job'
          drafts:
            type: array
            description: 关联的草稿列表（独立实体，有唯一标识和版本管理）
            items:
              $ref: '#/components/schemas/Draft'
          presentations:
            type: array
            description: 关联的演示文件列表
            items:
              $ref: '#/components/schemas/Presentation'

    # ===== 草稿相关 =====
    Draft:
      type: object
      description: '草稿（独立实体，有唯一标识和版本管理）

        草稿版本管理：
        - 版本号格式：年月日时分秒（如 20260907143025）
        - 同一草稿同一秒内只能保存一次（防止版本冲突）
        - 历史版本不可变，可随时还原
        '
      required:
      - draft_id
      - project_id
      - task_id
      - current_version
      - created_at
      - updated_at
      properties:
        draft_id:
          type: string
          description: 草稿唯一 ID
        project_id:
          type: string
          description: 所属项目标识
        task_id:
          type: string
          description: 生成此草稿的草稿引擎任务标识
        current_version:
          type: string
          description: 当前版本号（年月日时分秒格式）
          pattern: '^[0-9]{14}$'
        created_at:
          type: string
          format: date-time
          description: 创建时间（ISO 8601）
        updated_at:
          type: string
          format: date-time
          description: 最后更新时间（ISO 8601）

    DraftDetail:
      type: object
      description: 草稿详情（包含版本历史）
      allOf:
      - $ref: '#/components/schemas/Draft'
      - type: object
        properties:
          content:
            type: string
            description: 当前版本的 Markdown 内容
          versions:
            type: array
            description: 版本历史列表
            items:
              $ref: '#/components/schemas/DraftVersion'

    DraftVersion:
      type: object
      description: 草稿版本
      required:
      - draft_id
      - task_id
      - version
      - content
      - draft_path
      - created_at
      properties:
        draft_id:
          type: string
          description: 草稿标识
        project_id:
          type: string
          description: 所属项目标识
        task_id:
          type: string
          description: 生成任务（哪个草稿引擎任务创建的）
        version:
          type: string
          description: 版本号（年月日时分秒格式）
          pattern: '^[0-9]{14}$'
        content:
          type: string
          description: Markdown 内容
        draft_path:
          type: string
          description: 草稿文件路径（服务器上的存储位置）
        created_at:
          type: string
          format: date-time
          description: 版本创建时间（ISO 8601）

    ModifyDraftRequest:
      type: object
      description: 修改草稿请求
      required:
      - current_version
      - prompt
      properties:
        current_version:
          type: string
          description: 当前版本号（用于冲突检测）
          pattern: '^[0-9]{14}$'
        prompt:
          type: string
          description: 用户的修改提示词

    SaveDraftVersionRequest:
      type: object
      description: 保存草稿新版本请求
      required:
      - content
      properties:
        content:
          type: string
          description: 用户编辑后的 Markdown 内容

    # ===== 演示文件相关 =====
    Presentation:
      type: object
      description: 演示文件（最终产物）
      required:
      - presentation_id
      - project_id
      - task_id
      - file_name
      - file_format
      - file_path
      - created_at
      properties:
        presentation_id:
          type: string
          description: 演示文件唯一 ID
        project_id:
          type: string
          description: 所属项目标识
        task_id:
          type: string
          description: 生成此文件的输出引擎任务标识
        file_name:
          type: string
          description: 文件名称（默认为项目名称_年月日时分秒）
        file_format:
          type: string
          description: 文件格式（PPTX、HTML等）
          enum:
          - pptx
          - html
        file_path:
          type: string
          description: 文件路径（服务器上的存储位置）
        created_at:
          type: string
          format: date-time
          description: 创建时间（ISO 8601）

    # ===== 逐页预览相关（易失读模型，不落库）=====
    PageItem:
      type: object
      description: 单个已完成页的轻量描述（仅描述已生成页；运行中的转圈格由前端按 status+stage 条件渲染，不在此）。
      required:
      - index
      - name
      - url
      properties:
        index:
          type: integer
          description: 页序，从 1 开始（按文件名数字前缀 int 升序，不依赖 mtime）
        name:
          type: string
          description: 页文件名（如 03_overview.svg）
        url:
          type: string
          description: 预览地址，指向 /api/jobs/{job_id}/preview/{相对产物根目录的路径}
        kind:
          type: string
          enum:
          - image
          - html
          default: image
          description: 出图方式，引擎无关。image=内联 SVG/位图走 <Image>；html=整段 HTML 页走 iframe（已启用：单文件 HTML 引擎的每页是同一份产物里的第 N 个页面，前端按 ?slide={index}&static=1 请求，预览路由注入引导脚本定位并支持关闭 WebGL 背景；iframe 沙箱只给 allow-scripts，配合同源响应的 CSP sandbox 头保持隔离）
    JobPages:
      type: object
      description: 某输出引擎任务的逐页预览快照。只承载已确定的事实，不预测总页数、不含 pending 占位。
      required:
      - job_id
      - supports_page_preview
      - status
      - pages_generated
      - pages
      properties:
        job_id:
          type: string
          description: 任务标识
        engine:
          type: string
          description: 使用的引擎名
        supports_page_preview:
          type: boolean
          description: 是否支持逐页预览（由引擎是否实现逐页枚举钩子派生，非按引擎名硬判）
        status:
          allOf:
          - $ref: '#/components/schemas/JobStatus'
          description: 任务状态，供前端决定是否追加末尾转圈/导出格；queued 表示尚未开跑（既无转圈页也无导出格，显示「排队中 · 前面还有 N 个」）
        stage:
          type: string
          nullable: true
          description: 引擎阶段（generating/exporting 等），供前端决定末尾格语义
        pages_generated:
          type: integer
          description: 已完成页数（= len(pages)，单一读盘事实源）
        pages:
          type: array
          description: 已完成页列表（引擎不支持逐页时为空数组）
          items:
            $ref: '#/components/schemas/PageItem'

    # ===== 安全检查相关 =====
    SecurityCheckRequest:
      type: object
      description: 安全检查请求
      required:
      - content
      properties:
        content:
          type: string
          description: 待检查的草稿 Markdown 内容

    SecurityCheckResult:
      type: object
      description: 安全检查结果
      required:
      - passed
      properties:
        passed:
          type: boolean
          description: 检查是否通过
        reason:
          type: string
          description: 不通过的原因（通过时为空）
        rules_checked:
          type: array
          description: 已检查的规则列表
          items:
            type: string

    # ===== 通用 =====
    Error:
      type: object
      description: 错误响应
      required:
      - message
      properties:
        message:
          type: string
          description: 错误描述
        code:
          type: string
          description: 错误码（可选）

    UploadResponse:
      type: object
      description: 文件上传后的返回（服务器侧路径，供后续提交引用）
      required:
      - upload_id
      - filename
      - path
      properties:
        upload_id:
          type: string
          description: 上传标识（UUID）
        filename:
          type: string
          description: 原始文件名
        path:
          type: string
          description: 服务器存储路径（jobs_root/uploads/<upload_id>/<filename>），作为 sources[].value 提交
        size:
          type: integer
          description: 字节数

    SuggestTitleRequest:
      type: object
      description: '（已废弃，过渡兼容）拟题请求——改用 AgentExecuteRequest（kind=suggest_title）'
      required:
      - files
      properties:
        files:
          type: array
          description: 已上传文件列表（来自 UploadResponse）
          items:
            type: object
            required:
            - filename
            properties:
              filename:
                type: string
                description: 文件名
              path:
                type: string
                description: 上传返回的服务器路径（后端读内容给 Agent）

    SuggestTitleResult:
      type: object
      description: '（已废弃，过渡兼容）拟题结果——改用 AgentExecuteResult'
      required:
      - title
      properties:
        title:
          type: string
          description: Agent 拟定的演示文件标题

    AgentExecuteRequest:
      type: object
      description: 'Agent 文本处理统一请求：kind 是后端注册的白名单任务类型'
      required:
      - kind
      properties:
        kind:
          type: string
          enum:
          - modify_draft
          - suggest_title
          description: 任务类型（白名单，后端注册；新增能力需同步契约）
        draft_id:
          type: string
          description: 'modify_draft：草稿标识'
        version:
          type: string
          description: 'modify_draft：草稿版本号（用于冲突检测）'
          pattern: '^[0-9]{14}$'
        prompt:
          type: string
          description: 'modify_draft：用户的修改提示词'
        files:
          type: array
          description: 'suggest_title：已上传文件列表'
          items:
            type: object
            required:
            - filename
            properties:
              filename:
                type: string
                description: 文件名
              path:
                type: string
                description: 上传返回的服务器路径（后端读内容给 Agent）

    AgentExecuteResult:
      type: object
      description: Agent 文本处理统一响应（AI 返回的文本）
      required:
      - text
      properties:
        text:
          type: string
          description: AI 返回的文本（modify_draft 为改写后的 Markdown；suggest_title 为标题）
        kind:
          type: string
          description: 本次执行的任务类型（回显）

    AgentSessionResponse:
      type: object
      description: Agent 异步执行会话响应（立即返回会话ID和 agent 类型）
      required:
      - session_id
      - agent_type
      properties:
        session_id:
          type: string
          description: 会话ID（UUID格式，用于后续查询状态和流式输出）
        agent_type:
          type: string
          enum:
          - claude
          - codex
          - hermes
          description: Agent 类型，用于确定使用哪个原生接口查询会话状态

    AgentSessionStatus:
      type: object
      description: Agent 会话状态信息
      required:
      - session_id
      - status
      properties:
        session_id:
          type: string
          description: 会话ID
        status:
          type: string
          enum:
          - running
          - completed
          - failed
          description: 会话状态
        kind:
          type: string
          description: 任务类型（回显）
        latest_output:
          type: string
          description: 最新输出片段（可选，仅在 running 状态下有意义）
        completed_at:
          type: string
          format: date-time
          description: 完成时间（仅在 completed 或 failed 状态下有值）
        error:
          type: string
          description: 错误信息（仅在 failed 状态下有值）

    AgentSessionStreamEvent:
      type: object
      description: Agent 会话流式输出事件
      required:
      - type
      - data
      properties:
        type:
          type: string
          enum:
          - text
          - status
          - error
          - done
          description: 事件类型
        data:
          type: string
          description: 事件数据（text 为输出片段，status 为状态描述，error 为错误信息，done 为完成信号）

    # ===== 用户与鉴权相关 =====
    UserRole:
      type: string
      description: 用户角色（单一三值枚举，互斥）
      enum:
      - manager
      - vip
      - normal
    UserStatus:
      type: string
      description: 账号状态；禁用只挡登录、保留数据与项目
      enum:
      - enabled
      - disabled
    User:
      type: object
      description: 用户（权限与数据归属主体）。密码永不出现在任何响应。
      required:
      - user_id
      - username
      - role
      - status
      - created_at
      - updated_at
      properties:
        user_id:
          type: string
          description: 用户标识（内部主键，非登录凭据）
        username:
          type: string
          description: 用户名（登录凭据，唯一，创建后不可改）
        nickname:
          type: string
          description: 昵称（展示用，可改；默认同用户名）
        phone:
          type: string
          nullable: true
          description: 手机号（非必填）
        role:
          $ref: '#/components/schemas/UserRole'
        status:
          $ref: '#/components/schemas/UserStatus'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    LoginRequest:
      type: object
      required:
      - username
      - password
      properties:
        username:
          type: string
        password:
          type: string
          description: 明文密码仅在此入参出现，服务端即时哈希校验、不存储明文
    LoginResult:
      type: object
      description: 登录成功；Set-Cookie 下发会话，并内联完成访客项目认领
      required:
      - user
      - claimed_project_count
      properties:
        user:
          $ref: '#/components/schemas/User'
        claimed_project_count:
          type: integer
          description: 本次登录把多少访客未认领项目并入该用户（无则 0）
    CurrentUser:
      type: object
      description: '当前身份三态：已登录 / 未登录但有访客身份 / 纯匿名。/api/auth/me 恒 200。
        已登录看 authenticated+user；未登录试用看 visitor_id。'
      required:
      - authenticated
      properties:
        authenticated:
          type: boolean
        user:
          $ref: '#/components/schemas/User'
          description: 已登录时为对象；未登录时缺省（不存在）
        visitor_id:
          type: string
          nullable: true
          description: 未登录试用时的访客标识（cookie 承载）；无访客身份时为 null
    ChangePasswordRequest:
      type: object
      required:
      - old_password
      - new_password
      properties:
        old_password:
          type: string
        new_password:
          type: string
    UserCreate:
      type: object
      description: 管理员新增用户；初始密码固定 234567，不在此传
      required:
      - username
      properties:
        username:
          type: string
          description: 必填、唯一
        nickname:
          type: string
          description: 选填，缺省同用户名
        phone:
          type: string
          nullable: true
        is_vip:
          type: boolean
          default: false
          description: true→角色 vip，false→normal
    UserUpdate:
      type: object
      description: 管理员改用户信息；用户名不可改（不在字段内）
      properties:
        nickname:
          type: string
        phone:
          type: string
          nullable: true
        is_vip:
          type: boolean
          description: 在 normal↔vip 间切换；不影响 manager
    UserStatusUpdate:
      type: object
      required:
      - status
      properties:
        status:
          $ref: '#/components/schemas/UserStatus'
    ClaimProjectRequest:
      type: object
      description: 管理员代为认领——把未认领访客项目归到指定真实用户
      required:
      - target_user_id
      properties:
        target_user_id:
          type: string
    UserPreference:
      type: object
      description: 每用户一份的使用偏好；仅作初始值，不绕过角色门控
      properties:
        default_engine:
          type: string
          nullable: true
          description: 默认输出引擎（须为引擎注册表真实名）
        default_pages:
          type: integer
          nullable: true
        auto_save:
          type: boolean
          default: true
        updated_at:
          type: string
          format: date-time
    UserPreferenceUpdate:
      type: object
      description: 保存偏好（部分字段可缺省，缺省不改）
      properties:
        default_engine:
          type: string
          nullable: true
        default_pages:
          type: integer
          nullable: true
        auto_save:
          type: boolean
