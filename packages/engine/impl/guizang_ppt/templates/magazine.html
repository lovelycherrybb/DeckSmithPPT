<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{title}}</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --ink: {{ink}};
            --ink-rgb: {{ink_rgb}};
            --paper: {{paper}};
            --paper-rgb: {{paper_rgb}};
            --paper-tint: {{paper_tint}};
            --ink-tint: {{ink_tint}};
        }

        body {
            font-family: 'Noto Serif SC', 'Georgia', serif;
            background: var(--paper);
            color: var(--ink);
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        .presentation {
            width: 100vw;
            height: 100vh;
            display: flex;
            transition: transform 0.6s cubic-bezier(0.23, 1, 0.32, 1);
        }

        .slide {
            min-width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 8vh 10vw;
            position: relative;
            overflow: hidden;
        }

        /* WebGL 背景效果（模拟） */
        .slide::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(ellipse at 20% 50%, rgba(var(--ink-rgb), 0.03) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 20%, rgba(var(--ink-rgb), 0.02) 0%, transparent 50%);
            z-index: 0;
        }

        .slide-content {
            position: relative;
            z-index: 1;
            max-width: 1200px;
            width: 100%;
        }

        /* 封面样式 */
        .title-slide {
            text-align: center;
            background: var(--ink);
            color: var(--paper);
        }

        .title-slide .slide-content {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .title-slide h1 {
            font-family: 'Playfair Display', 'Noto Serif SC', serif;
            font-size: clamp(3rem, 6vw, 5rem);
            font-weight: 700;
            line-height: 1.2;
            margin-bottom: 2rem;
            letter-spacing: -0.02em;
        }

        .title-slide .subtitle {
            font-size: 1.5rem;
            opacity: 0.8;
            font-weight: 400;
        }

        .title-slide .meta {
            margin-top: 3rem;
            font-size: 1rem;
            opacity: 0.6;
        }

        /* 内容页样式 */
        .content-slide h2 {
            font-family: 'Playfair Display', 'Noto Serif SC', serif;
            font-size: clamp(2rem, 4vw, 3.5rem);
            font-weight: 700;
            margin-bottom: 3rem;
            color: var(--ink);
            position: relative;
        }

        .content-slide h2::after {
            content: '';
            display: block;
            width: 60px;
            height: 4px;
            background: var(--ink);
            margin-top: 1rem;
        }

        .content-slide p {
            font-size: 1.3rem;
            line-height: 1.8;
            margin-bottom: 1.5rem;
            color: var(--ink-tint);
        }

        .content-slide ul {
            list-style: none;
            padding: 0;
        }

        .content-slide li {
            font-size: 1.2rem;
            line-height: 1.6;
            margin-bottom: 1rem;
            padding-left: 2rem;
            position: relative;
            color: var(--ink-tint);
        }

        .content-slide li::before {
            content: '■';
            position: absolute;
            left: 0;
            color: var(--ink);
            font-size: 0.8rem;
        }

        /* 章节封面 */
        .section-slide {
            background: var(--paper-tint);
        }

        .section-slide .section-number {
            font-family: 'Playfair Display', serif;
            font-size: clamp(4rem, 10vw, 8rem);
            font-weight: 700;
            color: rgba(var(--ink-rgb), 0.1);
            position: absolute;
            top: 10%;
            right: 10%;
        }

        .section-slide h2 {
            font-family: 'Playfair Display', 'Noto Serif SC', serif;
            font-size: clamp(2.5rem, 5vw, 4rem);
            font-weight: 700;
        }

        /* 结束页 */
        .end-slide {
            background: var(--ink);
            color: var(--paper);
            text-align: center;
        }

        .end-slide h2 {
            font-family: 'Playfair Display', 'Noto Serif SC', serif;
            font-size: clamp(2rem, 4vw, 3rem);
            margin-bottom: 2rem;
        }

        .end-slide p {
            font-size: 1.2rem;
            opacity: 0.7;
        }

        /* 导航控制 */
        .nav {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            display: flex;
            gap: 0.5rem;
            z-index: 100;
        }

        .nav button {
            width: 40px;
            height: 40px;
            border: 2px solid var(--ink);
            background: transparent;
            color: var(--ink);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .nav button:hover {
            background: var(--ink);
            color: var(--paper);
        }

        /* 页码 */
        .page-number {
            position: fixed;
            bottom: 2rem;
            left: 2rem;
            font-size: 0.9rem;
            color: rgba(var(--ink-rgb), 0.5);
            z-index: 100;
        }

        /* 演讲者模式 */
        .presenter-notes {
            display: none;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 1rem 2rem;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            font-family: -apple-system, sans-serif;
            font-size: 0.9rem;
            z-index: 1000;
        }

        /* 响应式 */
        @media (max-width: 768px) {
            .slide {
                padding: 6vh 6vw;
            }
        }
    </style>
</head>
<body>
    <div class="presentation" id="presentation">
        {{slides}}
    </div>

    <div class="page-number" id="pageNumber">1 / {{totalSlides}}</div>

    <div class="nav">
        <button onclick="prevSlide()" aria-label="Previous">←</button>
        <button onclick="nextSlide()" aria-label="Next">→</button>
    </div>

    <div class="presenter-notes" id="presenterNotes"></div>

    <script>
        let currentSlide = 0;
        const presentation = document.getElementById('presentation');
        const slides = document.querySelectorAll('.slide');
        const pageNumber = document.getElementById('pageNumber');
        const totalSlides = slides.length;

        function updateSlide() {
            presentation.style.transform = `translateX(-${currentSlide * 100}vw)`;
            pageNumber.textContent = `${currentSlide + 1} / ${totalSlides}`;
            
            // 更新演讲者备注
            const notes = slides[currentSlide].dataset.notes;
            document.getElementById('presenterNotes').textContent = notes || '';
        }

        function nextSlide() {
            if (currentSlide < totalSlides - 1) {
                currentSlide++;
                updateSlide();
            }
        }

        function prevSlide() {
            if (currentSlide > 0) {
                currentSlide--;
                updateSlide();
            }
        }

        // 键盘导航
        document.addEventListener('keydown', (e) => {
            switch (e.key) {
                case 'ArrowRight':
                case 'ArrowDown':
                case ' ':
                case 'PageDown':
                    nextSlide();
                    break;
                case 'ArrowLeft':
                case 'ArrowUp':
                case 'PageUp':
                    prevSlide();
                    break;
                case 'Home':
                    currentSlide = 0;
                    updateSlide();
                    break;
                case 'End':
                    currentSlide = totalSlides - 1;
                    updateSlide();
                    break;
                case 'Escape':
                    // ESC 显示总览（简化版）
                    document.body.style.overflow = 'auto';
                    break;
                case 'p':
                case 'P':
                    // P 键切换演讲者模式
                    const notes = document.getElementById('presenterNotes');
                    notes.style.display = notes.style.display === 'block' ? 'none' : 'block';
                    break;
            }
        });

        // 触摸支持
        let touchStartX = 0;
        document.addEventListener('touchstart', (e) => {
            touchStartX = e.touches[0].clientX;
        });

        document.addEventListener('touchend', (e) => {
            const touchEndX = e.changedTouches[0].clientX;
            const diff = touchStartX - touchEndX;
            if (Math.abs(diff) > 50) {
                if (diff > 0) {
                    nextSlide();
                } else {
                    prevSlide();
                }
            }
        });

        // 鼠标滚轮
        document.addEventListener('wheel', (e) => {
            if (e.deltaY > 0) {
                nextSlide();
            } else if (e.deltaY < 0) {
                prevSlide();
            }
        }, { passive: true });

        // 初始化
        updateSlide();
    </script>
</body>
</html>
